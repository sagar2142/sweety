name: sweety

# Development:  docker compose up -d db            (only PostgreSQL, run API/client with npm)
# Full stack:   docker compose up --build          (PostgreSQL + API + client on http://localhost:8080)
# Demo data:    docker compose exec server npm run seed:prod

services:
  db:
    image: postgres:16-alpine
    container_name: sweety-db
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - sweety-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: sweety-server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://sweety:sweety@db:5432/sweety
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-before-deploying}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      BCRYPT_SALT_ROUNDS: 10
    # Not published: the client container proxies /api to it.

  client:
    build: ./client
    container_name: sweety-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  sweety-db-data:
