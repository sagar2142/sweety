server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Express container (same origin for the browser, so no CORS).
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files never change, so browsers can cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /reports) load index.html.
  location / {
    try_files $uri /index.html;
  }
}
